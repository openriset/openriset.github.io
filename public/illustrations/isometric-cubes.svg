<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" fill="none">
  <defs>
    <linearGradient id="cube-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bfdbfe"/><stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
    <linearGradient id="cube-left" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cube-right" x1="1" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#93c5fd"/><stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Cube 1 (bottom) -->
  <polygon points="160,240 220,210 160,180 100,210" fill="url(#cube-top)" stroke="#2563eb" stroke-width="0.5" opacity="0.9"/>
  <polygon points="100,210 160,240 160,260 100,230" fill="url(#cube-left)" stroke="#2563eb" stroke-width="0.5" opacity="0.7"/>
  <polygon points="160,240 220,210 220,230 160,260" fill="url(#cube-right)" stroke="#2563eb" stroke-width="0.5" opacity="0.5"/>
  <!-- Cube 2 (middle) -->
  <polygon points="160,190 220,160 160,130 100,160" fill="url(#cube-top)" stroke="#2563eb" stroke-width="0.5" opacity="0.85"/>
  <polygon points="100,160 160,190 160,210 100,180" fill="url(#cube-left)" stroke="#2563eb" stroke-width="0.5" opacity="0.6"/>
  <polygon points="160,190 220,160 220,180 160,210" fill="url(#cube-right)" stroke="#2563eb" stroke-width="0.5" opacity="0.4"/>
  <!-- Cube 3 (top, smallest) -->
  <polygon points="175,140 215,120 175,100 135,120" fill="url(#cube-top)" stroke="#2563eb" stroke-width="0.5" opacity="0.8"/>
  <polygon points="135,120 175,140 175,152 135,132" fill="url(#cube-left)" stroke="#2563eb" stroke-width="0.5" opacity="0.55"/>
  <polygon points="175,140 215,120 215,132 175,152" fill="url(#cube-right)" stroke="#2563eb" stroke-width="0.5" opacity="0.35"/>
  <!-- Floating small cube -->
  <polygon points="260,100 280,90 260,80 240,90" fill="url(#cube-top)" stroke="#2563eb" stroke-width="0.5" opacity="0.5"/>
  <polygon points="240,90 260,100 260,108 240,98" fill="url(#cube-left)" stroke="#2563eb" stroke-width="0.5" opacity="0.3"/>
  <polygon points="260,100 280,90 280,98 260,108" fill="url(#cube-right)" stroke="#2563eb" stroke-width="0.5" opacity="0.2"/>
</svg>
